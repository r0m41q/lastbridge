{% macro icon(name) -%}
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    {% if name == "home" %}
      <path d="m3 10 9-7 9 7v10H3Z"/>
      <path d="M9 20v-7h6v7"/>
    {% elif name == "mix" %}
      <path d="M4 5h16M4 12h16M4 19h16"/>
      <circle cx="9" cy="5" r="2"/>
      <circle cx="15" cy="12" r="2"/>
      <circle cx="8" cy="19" r="2"/>
    {% elif name == "library" %}
      <path d="M4 4v16M9 4v16m5-16 6 15M3 20h18"/>
    {% elif name == "list" %}
      <path d="M4 5h16M4 12h10M4 19h10m3-6 5 4-5 4Z"/>
    {% elif name == "radio" %}
      <circle cx="12" cy="12" r="2"/>
      <path d="M7 7a7 7 0 0 0 0 10M17 7a7 7 0 0 1 0 10M4 4a11 11 0 0 0 0 16M20 4a11 11 0 0 1 0 16"/>
    {% elif name == "sync" %}
      <path d="M20 7h-6m6 0V1M4 17h6m-6 0v6"/>
      <path d="M20 7a9 9 0 0 0-16 0m0 10a9 9 0 0 0 16 0"/>
    {% elif name == "arrow" %}
      <path d="M5 12h14m-6-6 6 6-6 6"/>
    {% elif name == "key" %}
      <circle cx="8" cy="9" r="5"/>
      <path d="m12 13 8 8m-3-3 3-3m-6 0 3-3"/>
    {% elif name == "users" %}
      <circle cx="9" cy="7" r="3"/>
      <path d="M3 21v-4a6 6 0 0 1 12 0v4m1-17a3 3 0 0 1 0 6m2 4a5 5 0 0 1 3 4v3"/>
    {% endif %}
  </svg>
{%- endmacro %}
